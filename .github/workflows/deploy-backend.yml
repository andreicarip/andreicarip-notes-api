name: Deploy backend

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Set up SSH key
        if: success()
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_BACKEND_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST_BACKEND }} >> ~/.ssh/known_hosts

      - name: Deploy to backend server
        if: success()
        run: |
          DEST="${{ secrets.SSH_USER_BACKEND }}@${{ secrets.SSH_HOST_BACKEND }}"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$DEST" 'cd /opt/api && ./deploy-backend.sh'
