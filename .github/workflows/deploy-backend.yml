name: Deploy backend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_BACKEND_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST_BACKEND }} >> ~/.ssh/known_hosts

      - name: Deploy to backend server
        run: |
          DEST="${{ secrets.SSH_USERNAME_BACKEND }}@${{ secrets.SSH_HOST_BACKEND }}"
          echo "Deploying to $DEST"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$DEST" 'cd /opt/api && ./deploy-backend.sh'
